name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限把 APK 挂到 latest release

jobs:
  build:
    # 固定 24.04：ubuntu-latest 今天（2026-10-19）开始迁移到 Ubuntu 26，
    # 新镜像里的 Android SDK 路径可能变，第一次构建先不要踩这个变量
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 android-actions/setup-android@v3：
      # 该 action 被强制跑在 Node 24 上，会在启动阶段直接失败（第 1 次构建就挂在这里）。
      # runner 镜像本身已预装 Android SDK，这里只接受 licenses 并补齐 API 34。
      - name: Prepare Android SDK
        run: |
          set -u
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK path: $SDK"
          ls "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            echo "--- installed packages ---"
            "$SM" --list_installed 2>/dev/null | head -30 || true
          else
            echo "::warning::sdkmanager not found at $SM - relying on AGP SDK auto-download"
            ls "$SDK/cmdline-tools" 2>/dev/null || true
          fi

      # 工程未携带 gradle-wrapper.jar，这里用固定版本 Gradle 构建
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # 顺手把 wrapper 生成出来，方便在本地 ./gradlew 构建（本仓库不便携带二进制）
      - name: Generate gradle wrapper
        if: success()
        run: gradle wrapper --gradle-version 8.7

      - name: Upload gradle wrapper
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/**
          retention-days: 30

      - name: Show APK info
        if: success()
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScanPdf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 固定下载地址：/releases/download/latest/app-debug.apk
      # 每次构建覆盖同一个 latest release，不用再进 Actions 页面找 Artifacts
      - name: Publish to latest release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "最新构建" \
              --notes "由 GitHub Actions 自动构建，提交 ${GITHUB_SHA:0:7}" \
              --latest
          gh release upload latest "$APK" --clobber
          echo "### APK: https://github.com/${{ github.repository }}/releases/download/latest/$(basename "$APK")" >> "$GITHUB_STEP_SUMMARY"
